<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiện Ích Dự Án Central Riverside Thanh Hóa - Chuẩn Sống Thượng Lưu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <script src="../assets.js"></script>
</head>

<body>

    <header id="header" class="is-sticky">
        <div class="container">
            <div class="header-main">
                <div class="logo">
                    <a href="/">
                        <img src="" data-asset="logo" alt="Central Riverside Logo">
                    </a>
                </div>
                <nav class="header-nav">
                    <ul>
                        <li><a href="/">Trang Chủ</a></li>
                        <li><a href="/vi-tri/">Vị Trí</a></li>
                        <li><a href="/tien-ich/">Tiện Ích</a></li>
                        <li><a href="/mat-bang/">Mặt Bằng</a></li>
                        <li><a href="/gia-ban/">Giá Bán</a></li>
                        <li><a href="/tin-tuc/">Tin tức</a></li>
                        <li><a href="/#contact">Liên Hệ</a></li>
                    </ul>
                </nav>
                <div id="mobile-toggle" class="mobile-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </header>

    <div id="mobile-overlay" class="mobile-overlay"></div>
    <div id="mobile-menu" class="mobile-menu">
        <div style="text-align: right; margin-bottom: 20px;">
            <i id="close-mobile" class="fas fa-times" style="font-size: 24px; cursor: pointer;"></i>
        </div>
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <a href="/" style="font-weight: 700; text-transform: uppercase;">Trang Chủ</a>
            <a href="/vi-tri/" style="font-weight: 700; text-transform: uppercase;">Vị Trí</a>
            <a href="/tien-ich/" style="font-weight: 700; text-transform: uppercase;">Tiện Ích</a>
            <a href="/mat-bang/" style="font-weight: 700; text-transform: uppercase;">Mặt Bằng</a>
            <a href="/gia-ban/" style="font-weight: 700; text-transform: uppercase;">Giá Bán</a>
            <a href="/tin-tuc/" style="font-weight: 700; text-transform: uppercase;">Tin tức</a>
            <a href="/#contact" style="font-weight: 700; text-transform: uppercase;">Liên Hệ</a>
        </div>
    </div>

    <main style="margin-top: 120px;">
        <div class="container">
            <div class="section-title">
                <h2>HỆ THỐNG TIỆN ÍCH ĐẲNG CẤP</h2>
            </div>

            <div class="row">
                <div class="col large-4">
                    <div class="amenity-card">
                        <img src="" data-asset="amenity1"
                            alt="Tiện ích 1">
                        <div class="amenity-info">
                            <h4>CÔNG VIÊN TRUNG TÂM</h4>
                        </div>
                    </div>
                </div>
                <div class="col large-4">
                    <div class="amenity-card">
                        <img src="" data-asset="amenity2"
                            alt="Tiện ích 2">
                        <div class="amenity-info">
                            <h4>KHU VUI CHƠI TRẺ EM</h4>
                        </div>
                    </div>
                </div>
                <div class="col large-4">
                    <div class="amenity-card">
                        <img src="" data-asset="amenity3"
                            alt="Tiện ích 3">
                        <div class="amenity-info">
                            <h4>ĐƯỜNG DẠO BỘ VEN SÔNG</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer style="background: #111; color: white; padding: 30px 0 30px; margin-top: 100px;">
        <div class="container" style="text-align: center; font-size: 12px;">
            <p>&copy; 2024 Central Riverside. All Rights Reserved.</p>
        </div>
    </footer>

    <div class="floating-contact">
        <a href="" class="contact-btn phone asset-href" data-asset="hotline"><i class="fas fa-phone-alt"></i></a>
        <a href="" class="contact-btn zalo asset-href" data-asset="zaloLink"><img src="" data-asset="zaloIcon"
                alt="Zalo" width="35"></a>
    </div>

    <script src="../script.js"></script>
</body>

</html>
